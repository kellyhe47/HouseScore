[project]
name = "houseaccount"
version = "0.1.0"
description = "HouseAccount House Score — door scoring for Ramsey, NJ"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32",
  "shapely>=2.0",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "mcp>=1.2",
  "openai>=1.50",
  "pillow>=11.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/houseaccount"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
